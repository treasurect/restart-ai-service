server:
  port: 8082
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/restart_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: treasure
    password: ${DB_PWD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

mybatis:
  configuration:
    map-underscore-to-camel-case: true

ai:
  provider: deepseek
  providers:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      model: deepseek-flash
      connect-timeout: 10s
      response-timeout: 180s
      tokenizer:
        path: ${DEEPSEEK_TOKENIZER_PATH:./tokenizers/v41/tokenizer.json}

jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH}
