server:
  port: 8082
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/restart_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: treasure
    password: ${DB_PWD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

mybatis:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH}

ai:
  service:
    base-url: ${LLM_SERVICE_BASE_URL:https://api.treasurect.site}
    timeout: ${LLM_SERVICE_TIMEOUT:180s}

  providers:
    deepseek:
      tokenizer:
        path: ${DEEPSEEK_TOKENIZER_PATH:./tokenizers/v41/tokenizer.json}
